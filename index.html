function story(){g.storyId??=STORYLINES[(g.seed>>>0)%STORYLINES.length].id;return STORYLINES.find(x=>x.id===g.storyId)||STORYLINES[0]}
function storyState(){g.storyProgress??='offered';return g.storyProgress}
function storyAction(action){if(g.battle||g.over)return;const st=storyState(),arc=story();if(action==='accept'&&st==='offered'&&g.zone===0){g.storyProgress='investigate';note('📖 Historia iniciada: '+arc.title+'. '+arc.intro)}
else if(action==='investigate'&&st==='investigate'&&g.zone===arc.zone){g.storyProgress='return';note('🔍 '+arc.conclusion+' Vuelve a la Comarca para decidir qué contar.');}
else if((action==='truth'||action==='hide')&&st==='return'&&g.zone===0){g.storyProgress='done';g.storyChoice=action;if(action==='truth'){g.ethics=Math.min(10,g.ethics+1);g.rep=Math.min(5,g.rep+1);g.money+=150;note('📖 Cuentas lo sucedido con sinceridad. Recibes 150 Pokécuartos, ética +1 y reputación +1.')}else{g.ethics=Math.max(-10,g.ethics-1);g.money+=250;note('📖 Ocultas una parte de la historia a cambio de una recompensa mayor. Recibes 250 Pokécuartos y ética -1.')}}else return;save();render()}
function talk(id){if(g.battle||g.over)return;const npc=NPCS.find(x=>x.id===id);if(!npc||npc.zone!==g.zone)return;g.npcDialog=id;save();render()}
function npcChoice(id,index){if(g.battle||g.over)return;const npc=NPCS.find(x=>x.id===id);if(!npc||npc.zone!==g.zone||g.npcDialog!==id)return;g.npcChoices??={};if(g.npcChoices[id]!==undefined)return;const choice=npc.choices[index];if(!choice)return;g.npcChoices[id]=index;const [label,message,kind,value]=choice;if(kind==='rep')g.rep=Math.min(5,g.rep+value);if(kind==='money')g.money+=value;if(kind==='potion')g.bag.potion=(g.bag.potion||0)+value;note('💬 '+npc.name+': '+message);g.npcDialog=null;save();render()}
function npcPanel(){const people=NPCS.filter(n=>n.zone===g.zone);const arc=story(),st=storyState();return `<div class="panel"><h3>🏡 Personas y rumores</h3><p class="sub">Habla con los habitantes. Cada conversación con consecuencias se resuelve una sola vez.</p>${people.map(n=>`<div class="note"><strong>${esc(n.name)}</strong><p>${esc(n.text)}</p>${g.npcChoices?.[n.id]!==undefined?`<span class="tag">Ya habéis hablado</span>`:g.npcDialog===n.id?`<div class="btns">${n.choices.map((c,i)=>`<button class="secondary" onclick="npcChoice('${n.id}',${i})">${esc(c[0])}</button>`).join('')}</div>`:`<button class="secondary" onclick="talk('${n.id}')">💬 Hablar</button>`}</div>`).join('')}${g.zone===0?`<div class="note"><strong>📖 ${esc(arc.title)}</strong><p>${esc(arc.intro)}</p>${st==='offered'?`<button class="gold" onclick="storyAction('accept')">Escuchar la historia de ${esc(arc.npc)}</button>`:st==='return'?`<p>Has descubierto lo ocurrido. ¿Cómo lo contarás?</p><button onclick="storyAction('truth')">Contar la verdad</button> <button class="secondary" onclick="storyAction('hide')">Ocultar parte de lo ocurrido</button>`:st==='done'?`<span class="tag">Historia resuelta: ${g.storyChoice==='truth'?'sinceridad':'secreto'}</span>`:`<span class="tag">Investiga en ${esc(ZONES[arc.zone][0])}</span>`}</div>`:''}${g.zone===arc.zone&&st==='investigate'?`<div class="note"><strong>🔍 Pista: ${esc(arc.title)}</strong><p>Observa el entorno para avanzar en esta historia.</p><button class="gold" onclick="storyAction('investigate')">Investigar la pista</button></div>`:''}</div>`}

function worldPosition(){g.worldPositions??={};const k=String(g.zone);if(!g.worldPositions[k])g.worldPositions[k]=g.zone===7?{x:7,y:5}:g.zone===0?{x:7,y:8}:{x:6,y:9};if(!walkable(g.worldPositions[k].x,g.worldPositions[k].y))g.worldPositions[k]=g.zone===7?{x:7,y:5}:g.zone===0?{x:7,y:8}:{x:6,y:9};return g.worldPositions[k]}
function walkable(x,y){const row=WORLD_ROWS[g.zone]?.[y];return !!row&&x>=0&&x<row.length&&row[x]!=='T'&&row[x]!=='w'&&row[x]!=='h'&&row[x]!=='m'}
function worldMove(dx,dy){if(!g||g.battle||g.over)return;const p=worldPosition(),x=p.x+dx,y=p.y+dy;if(!walkable(x,y))return;p.x=x;p.y=y;g.worldSteps=(g.worldSteps||0)+1;if(POOLS[g.zone]&&g.worldSteps%7===0)note('Oyes movimiento entre la vegetación. Puedes explorar para buscar Pokémon.');save();render()}

if(poi.npc){talk(poi.npc);return}

if(poi.action==='arroyo'){inspectPlace('arroyo');return}if(poi.action==='vigia'){inspectPlace('vigia');return}
note('📍 '+(actions[poi.action]||poi.label));save();render()}

}
function worldPanel(){const p=worldPosition(),pois=WORLD_POIS[g.zone]||[],rows=WORLD_ROWS[g.zone];return `<section class="world"><div class="world-head"><strong>🗺️ ${esc(ZONES[g.zone][0])}</strong><span class="tag">Exploración 2D</span></div><div class="world-frame"><svg class="world-art" viewBox="0 0 480 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa interactivo de ${esc(ZONES[g.zone][0])}">${rows.map((row,y)=>[...row].map((cell,x)=>`<g transform="translate(${x*32},${y*32})">${terrainSVG(cell,x,y)}</g>`).join('')).join('')}${pois.map((q,i)=>`<g transform="translate(${q.x*32},${q.y*32})"><rect x="3" y="3" width="26" height="26" rx="6" fill="#192b22" opacity=".72"/><text x="16" y="23" text-anchor="middle" font-size="20">${q.emoji}</text></g>`).join('')}<g transform="translate(${p.x*32},${p.y*32})"><ellipse cx="16" cy="28" rx="11" ry="4" fill="#172f23" opacity=".65"/><circle cx="16" cy="10" r="7" fill="#f0c18d"/><path d="M6 7Q16 -3 26 7" fill="#573c29"/><path d="M10 17h12l5 11H5Z" fill="#b43d3a"/><path d="M10 19h12" stroke="#f5d587" stroke-width="3"/></g></svg><div class="world-clickgrid">${rows.map((row,y)=>[...row].map((cell,x)=>{const idx=pois.findIndex(q=>q.x===x&&q.y===y),near=idx>=0&&Math.abs(p.x-x)+Math.abs(p.y-y)<=1;return `<button class="world-hit" aria-label="${esc(idx>=0?pois[idx].label:'Casilla '+x+','+y)}" onclick="${near?`worldInteract(${idx})`:`worldStepTo(${x},${y})`}" type="button"></button>`}).join('')).join('')}</div></div><div class="world-help">Muévete con las flechas o toca una casilla vecina. Acércate a los iconos para interactuar.</div><div class="pad"><span></span><button onclick="worldMove(0,-1)">↑</button><span></span><button onclick="worldMove(-1,0)">←</button><button onclick="worldMove(0,1)">↓</button><button onclick="worldMove(1,0)">→</button></div><div class="world-action">${pois.map((q,i)=>{const near=Math.abs(p.x-q.x)+Math.abs(p.y-q.y)<=1;return `<button class="secondary" ${near?'':'disabled'} onclick="worldInteract(${i})">${q.emoji} ${esc(q.label)}</button>`}).join(' ')}</div></section>`}
function worldStepTo(x,y){const p=worldPosition();if(Math.abs(p.x-x)+Math.abs(p.y-y)!==1)return;worldMove(x-p.x,y-p.y)}
function start(name){g={seed:(Date.now()>>>0)||1,serial:0,zone:0,unlocked:0,steps:0,team:[],box:[],pi:0,money:500,bag:{ball:5,potion:2},ethics:0,rep:0,decisions:{},quests:{},flags:{},encountered:{},caught:[],trainers:{},trainerEncounters:{},npcChoices:{},storyProgress:"offered",gym:false,over:false,log:[]};g.team.push(make(name,5));note(`Eliges a ${name}. La aventura comienza en la Comarca.`);save();render()}
function card(p){return `<div class="poke"><div class="row"><strong>${esc(p.name)}</strong><span class="tag">Nv. ${p.lvl}</span></div><span class="sub">${p.dead?'☠️ Fallecido':p.hp+' / '+p.max+' PS'}</span><div class="bar"><div class="fill ${p.hp/p.max<.3?'low':''}" style="width:${p.hp/p.max*100}%"></div></div><span class="sub">${SPEC[p.name].type.join(' / ')} · EXP ${p.xp}/${xpNeed(p.lvl)}</span></div>`}
function render(){if(!g){$('app').innerHTML=`<div class="intro panel"><div class="hero">🌄</div><h2>Una mañana en la Comarca</h2><p>La brisa recorre los campos mientras un viajero te ofrece elegir a tu primer compañero. Más allá de los caminos conocidos, los enanos hablan de un desafío de tipo Roca.</p><div class="note">En esta aventura, un Pokémon que llega a 0 PS muere para siempre. Las capturas por zona son limitadas.</div><h3>Elige a tu compañero</h3><div class="grid">${['Bulbasaur','Charmander','Squirtle'].map(n=>`<button onclick="start('${n}')">${n}<br><small>Nivel 5</small></button>`).join('')}</div></div>`;return}const z=g.zone;let main=`<div class="panel"><div class="row"><h2>${ZONES[z][1]} ${ZONES[z][0]}</h2><span class="tag">${g.gym?'🏅 Insignia de Roca':'Capítulo I'}</span></div><p>${ZONES[z][2]}</p><div class="map">${ZONES.map((p,i)=>`<button class="place ${i===z?'active':''} ${i>g.unlocked?'locked':''}" ${i>g.unlocked||g.battle||g.over?'disabled':''} onclick="travel(${i})">${p[1]}<br>${p[0]}</button>`).join('')}</div>${!g.battle&&!g.over?worldPanel():''}`;
if(g.over)main+=`<div class="note"><h2>Fin de la aventura</h2>Todos tus Pokémon han muerto. Su recuerdo permanece en el memorial.</div><button class="danger" onclick="resetGame()">Nueva partida</button>`;
else if(g.battle){const b=g.battle,p=active('p'),e=active('e');main+=`<h3>⚔️ ${b.kind==='gym'?'Rathôl Mortak':b.kind==='trainer'?'Entrenador':'Encuentro salvaje'}</h3><div class="grid">${card(p)}${card(e)}</div><p class="muted">Turno ${b.turn+1} · ${b.kind==='wild'?(b.catchable?'Captura disponible':'Solo entrenamiento'):''}</p><div class="btns">${p.moves.map(m=>`<button ${p.pp[m]===0?'disabled':''} onclick="battleAction('move','${m}')">${m} <small>(${p.pp[m]} PP)</small></button>`).join('')}</div><div class="btns"><button class="secondary" ${!g.bag.potion||p.hp===p.max?'disabled':''} onclick="battleAction('potion')">🧪 Poción (${g.bag.potion})</button>${b.kind==='wild'?`<button class="secondary" onclick="battleAction('flee')">🏃 Huir${z===1?' (seguro)':''}</button><button class="gold" ${!b.catchable||!g.bag.ball?'disabled':''} onclick="battleAction('ball')">🔴 Poké Ball (${g.bag.ball})</button>`:''}</div><h3>Cambiar de compañero</h3><div class="btns">${g.team.map((x,i)=>`<button class="secondary" ${i===g.pi||x.dead||x.hp<=0?'disabled':''} onclick="battleAction('switch',${i})">${x.name} ${x.hp} PS</button>`).join('')}</div>`}
else{main+=`${z===1?`<div class="note">🌱 Zona de iniciación: salvajes adaptados, daño reducido y huida garantizada. Puedes volver a la Comarca para curarte. La muerte permanente sigue activa.</div>`:''}<div class="btns">${POOLS[z]?`<button onclick="explore()">🌿 Explorar la zona</button>`:''}${z===0||z===5?`<button onclick="heal()">💚 Descansar en lugar seguro</button>`:''}${(z===4||z===6)&&!g.trainerEncounters?.['ruta_'+z]?`<button onclick="trainer()">⚔️ Desafiar a un entrenador</button>`:''}${z===7&&!g.gym?`<button class="gold" onclick="gym()">⚒️ Desafiar a Rathôl</button>`:''}${z===3&&!g.flags?.arroyo?`<button class="secondary" onclick="inspectPlace('arroyo')">🔎 Investigar las huellas</button>`:''}${z===6&&!g.flags?.vigia?`<button class="secondary" onclick="inspectPlace('vigia')">🗣️ Hablar con el vigía enano</button>`:''}${z===5?`<button onclick="buy('ball')">Poké Ball · 200</button><button onclick="buy('potion')">Poción · 300</button>`:''}${z===2&&!g.decisions?.bosquecillo?`<div class="note">Encuentras a un Pokémon herido junto a unas provisiones abandonadas. ¿Qué decides hacer?</div><button class="secondary" onclick="ethics('bosquecillo','ayudar')">Ayudar al Pokémon herido</button><button class="secondary" onclick="ethics('bosquecillo','provisiones')">Tomar las provisiones ajenas</button>`:''}${g.unlocked<7&&z===g.unlocked?`<button class="gold" onclick="advance()">➡️ Abrir siguiente tramo</button>`:''}</div>${z===6?`<div class="note">Los enanos advierten: los Pokémon de Agua y Planta son especialmente útiles frente a los de Roca. Entrena antes de entrar.</div>`:''}${g.gym?`<div class="note">🏅 Has superado el primer gimnasio. Fin del capítulo disponible en este prototipo.</div>`:''}`}
main+='</div>';const side=`<div class="panel"><h3>🎒 Aventura</h3><div class="row"><span>Pokécuartos</span><strong>${g.money}</strong></div><div class="row"><span>Poké Balls</span><strong>${g.bag.ball}</strong></div><div class="row"><span>Pociones</span><strong>${g.bag.potion}</strong></div><div class="row"><span>Ética</span><strong>${g.ethics}</strong></div><div class="row"><span>Capturas</span><strong>${g.caught.length}</strong></div><hr style="border-color:#34504d"><h3>Equipo (${g.team.length}/6)</h3><div class="grid">${g.team.map(card).join('')}</div><p class="sub">Cajas: ${g.box.length} · Memorial: ${[...g.team,...g.box].filter(p=>p.dead).length} fallecidos</p></div>${npcPanel()}${questPanel()}<div class="panel"><h3>📜 Diario</h3><div class="log">${g.log.map(s=>`<div>${esc(s)}</div>`).join('')}</div></div><div class="panel"><button class="secondary" onclick="save();alert('Partida guardada en este navegador.')">💾 Guardar</button> <button class="danger" onclick="resetGame()">Reiniciar</button><p class="sub">Autoguardado tras cada decisión. Sin servidor.</p></div>`;$('app').innerHTML=`<div class="layout"><main>${main}</main><aside>${side}</aside></div>`}
function resetGame(){if(confirm('¿Eliminar esta partida y empezar de nuevo?')){localStorage.removeItem('pokemon_middleearth_v161');g=null;render()}}try{const saved=localStorage.getItem('pokemon_middleearth_v161');if(saved){g=JSON.parse(saved);if(!g||!Array.isArray(g.team))g=null}}catch(e){g=null}render();
</script></body></html>
