<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon: Senderos de la Tierra Media</title><style>
:root{color-scheme:dark;--bg:#0e1618;--panel:#19282a;--edge:#34504d;--gold:#d6b875;--ink:#e8e9dc;--muted:#afc0b5;--green:#65b997}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#263e35,#0e1618 68%);min-height:100vh}header{padding:22px max(18px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--edge);background:#101d1dcc}h1,h2,h3{font-family:Georgia,serif;margin:0 0 9px;color:#ead5a0}h1{font-size:clamp(23px,3vw,36px)}h2{font-size:23px}h3{font-size:18px}.sub{color:var(--muted);font-size:13px}.layout{max-width:1150px;margin:22px auto;padding:0 15px;display:grid;grid-template-columns:1.8fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:19px;margin-bottom:16px;box-shadow:0 12px 30px #0002}.panel p{margin:8px 0 15px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{background:#315249;color:white;border:1px solid #58806b;border-radius:8px;padding:10px 13px;cursor:pointer;font:inherit}button:hover:not(:disabled){background:#416b57}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#283638;border-color:#465a56}.danger{background:#663c3a;border-color:#995753}.gold{background:#735f36;border-color:#b79a59}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.poke{background:#122123;border:1px solid #3a5551;padding:13px;border-radius:9px}.poke strong{color:#ead5a0}.bar{height:9px;background:#3a4242;border-radius:10px;overflow:hidden;margin:7px 0}.fill{height:100%;background:var(--green)}.low{background:#e58b6c}.tag{display:inline-block;background:#354c46;border-radius:5px;padding:1px 6px;font-size:11px;color:#d3e1d6;margin-right:4px}.log{max-height:230px;overflow:auto;background:#111e20;border-radius:8px;padding:10px;font-size:13px}.log div{border-bottom:1px solid #283738;padding:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.place{background:#243c38;border:1px solid #4c6860;border-radius:9px;padding:13px 7px;text-align:center;font-size:13px}.place.active{outline:2px solid var(--gold);background:#41513a}.place.locked{opacity:.42}.hero{padding:25px 10px 20px;text-align:center;font-size:45px}.intro{max-width:700px;margin:50px auto;padding:0 15px}.hidden{display:none}.note{border-left:3px solid var(--gold);padding:10px 14px;background:#2b332b;margin:12px 0}footer{text-align:center;color:#a2b5aa;padding:20px;font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}}

.world{margin:16px 0;background:#0e211b;border:2px solid #6c7450;border-radius:12px;padding:12px}
.world-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
.world-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px;max-width:520px;margin:auto;aspect-ratio:9/7}
.tile{padding:0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #375b43;border-radius:3px;background:#456943;font-size:clamp(12px,2.5vw,22px);position:relative}
.tile.path{background:#987d4f;border-color:#a99363}.tile.water{background:#356d82;border-color:#5e96a7}.tile.wood{background:#244c37}.tile.wall{background:#414b45}.tile.player{outline:3px solid #f4d477;outline-offset:-3px;z-index:1;background:#b19448}
.tile.poi{border-color:#e2c786}.tile:disabled{opacity:1;cursor:default}
.world-help{font-size:12px;color:#c3d0b7;margin-top:8px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:10px auto}
.pad button{padding:8px 0}.world-action{margin:10px 0;padding:10px;border:1px solid #647b59;border-radius:8px;background:#263b30}
@media(max-width:480px){.tile{font-size:16px}.world{padding:8px}}

.world-frame{position:relative;width:100%;max-width:600px;margin:auto;aspect-ratio:15/11;border:3px solid #b7a377;border-radius:8px;overflow:hidden;box-shadow:0 8px 28px #0b1713}
.world-art{display:block;width:100%;height:100%;image-rendering:pixelated}
.world-clickgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(11,1fr)}
.world-hit{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;min-width:0!important;border-radius:0!important;opacity:1!important}
.world-hit:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.world-hit:active{background:#ffffff33!important}
.narrative{border:2px solid #b79a59;background:#29362c;position:relative}.narrative h3{margin-bottom:5px}.narrative p{font-size:15px}.room{background:radial-gradient(#806747,#4c392e);padding:22px;border:5px solid #9a7b52;border-radius:12px;text-align:center;margin:12px 0}.room-icon{font-size:38px;margin:12px}.world-help{font-size:12px}.narrative .note{margin-top:10px}
/* Dirección artística aprobada — V16.1 */
:root{--oro:#d6b66e;--pergamino:#e9dfc7}
header{border-bottom:2px solid #967b47;background:linear-gradient(130deg,#1b291e,#343021)}
.panel{border-color:#706144}.panel h2,.panel h3{color:#e9c881}
button{touch-action:manipulation}
.region-plate{position:relative;height:clamp(110px,28vw,190px);overflow:hidden;border:2px solid #9d854f;border-radius:10px;margin:10px 0;background:#27392b}
.region-plate img{width:100%;height:100%;object-fit:cover;object-position:center 48%;filter:saturate(.93)}
.region-plate span{position:absolute;left:10px;bottom:9px;padding:5px 12px;background:#141b16dc;border:1px solid #c9a85f;border-radius:5px;color:#f1d38d;font-weight:700}
.room-art{position:relative;min-height:240px;background:#3a3027;border:3px solid #c5a76a;border-radius:10px;overflow:hidden;margin:10px 0}
.room-art>img{display:block;width:100%;max-height:340px;object-fit:cover}
.room-art .room-caption{background:#171b19ed;padding:12px;border-top:2px solid #c5a76a;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.room-caption button{margin-left:auto}
.dialog-portrait{display:block;width:92px;height:92px;object-fit:cover;object-position:center 35%;border:2px solid #d6b66e;border-radius:9px;float:left;margin:0 12px 8px 0}
.narrative{scroll-margin-top:10px}
.narrative .note:after{content:'';display:block;clear:both}

const QUESTS=[

function npcChoice(id,index){if(g.battle||g.over||!npcAccessible(id)||g.npcDialog!==id)return;const npc=NPCS.find(x=>x.id===id);if(!npc||npc.zone!==g.zone)return;const d=dialogueState(id),node=dialogueNode(id),choice=node.choices[index];if(!choice)return;const next=choice[1];if(next==='accept_help'&&!d.resolved.help&&!d.resolved.refuse){d.resolved.help=true;g.rep=Math.min(5,g.rep+1);g.ethics=Math.min(10,g.ethics+1);note('🤝 Ayudas a '+npc.name+'. Ética +1 y reputación +1.')}if(next==='refuse_help'&&!d.resolved.help&&!d.resolved.refuse){d.resolved.refuse=true;note('💬 '+npc.name+' acepta tu negativa.')}if(next==='promise'&&!d.resolved.promise){d.resolved.promise=true;g.flags??={};g.flags['confianza_'+id]=true;note('📜 '+npc.name+' recuerda tu promesa.')}d.history.push(next);d.history=d.history.slice(-24);if(next==='close'){g.npcDialog=null;d.node='intro'}else d.node=next;save();render()}

function npcPanel(){const n=NPCS.find(n=>n.id===g.npcDialog&&npcAccessible(n.id));if(!n)return '';const d=dialogueState(n.id),node=dialogueNode(n.id);return `<div class="note"><h3>💬 ${esc(n.name)}</h3><p>${esc(node.text)}</p><span class="tag">Conversación · ${d.visits} visita(s)</span><div class="btns">${node.choices.map((c,i)=>`<button class="secondary" onclick="npcChoice('${n.id}',${i})">${esc(c[0])}</button>`).join('')}</div></div>`}

function worldPosition(){g.worldPositions??={};const k=String(g.zone);if(!g.worldPositions[k])g.worldPositions[k]={x:4,y:9};return g.worldPositions[k]}
function walkable(x,y){const row=WORLD_ROWS[g.zone]?.[y];return !!row&&x>=0&&x<row.length&&row[x]!=='T'&&row[x]!=='w'&&row[x]!=='h'&&row[x]!=='m'}
function worldMove(dx,dy){if(!g||g.battle||g.over||g.inside)return;const p=worldPosition(),x=p.x+dx,y=p.y+dy;if(!walkable(x,y))return;p.x=x;p.y=y;g.worldSteps=(g.worldSteps||0)+1;if(rowsGrass(g.zone,x,y)&&POOLS[g.zone]&&rng()<.18){explore(true);return}save();render()}
function worldInteract(index){if(!g||g.battle||g.over||g.inside)return;const poi=WORLD_POIS[g.zone]?.[index];if(!poi)return;const p=worldPosition();if(!sceneMode()&&Math.abs(p.x-poi.x)+Math.abs(p.y-poi.y)>1){note('Acércate para interactuar.');save();render();return}
if(poi.indoor){enterHouse(poi.indoor);return}if(poi.npc){talk(poi.npc);return}
const actions={huerto:'El huerto de Milo está lleno de hortalizas y senderos cuidadosamente trazados.',viajero:'El viento trae el aroma de las flores y rumores de viajeros.',bosque:'Hay marcas pequeñas entre las raíces. Algo se mueve en el sotobosque.',camino:'La vieja piedra señala Bree y las tierras de los enanos.',posada:'En la posada, los viajeros intercambian historias del Camino del Este.',mercado:'Los mercaderes venden Poké Balls y Pociones. Puedes usar la tienda.',gimnasio:'Tras la puerta de piedra te espera Rathôl Mortak.'};
if(poi.action==='arroyo'){inspectPlace('arroyo');return}if(poi.action==='vigia'){inspectPlace('vigia');return}
note('📍 '+(actions[poi.action]||poi.label));save();render()}
function terrainSVG(cell,x,y){const seed=(x*43+y*97+g.zone*71)%11;const grass=seed%3===0?'<path d="M8 27l3-6 2 6m10-2 3-5 2 5" fill="none" stroke="#b2ce77" stroke-width="1.5"/>':'';const soil='<path d="M3 6h6M23 25h5" stroke="#b5a074" stroke-width="1" opacity=".6"/>';
if(cell==='T')return '<rect width="32" height="32" fill="#305b3c"/><circle cx="16" cy="13" r="14" fill="#1d422d"/><circle cx="11" cy="10" r="10" fill="#3f7748"/><circle cx="21" cy="17" r="9" fill="#285c39"/><path d="M13 5l-3 6m14 8l-4 5" stroke="#80a25b" stroke-width="2"/>';
if(cell==='w')return '<rect width="32" height="32" fill="#2e718b"/><path d="M-2 10Q7 4 16 10T34 10M-2 24Q7 18 16 24T34 24" stroke="#8dc9d4" stroke-width="2" fill="none" opacity=".7"/>';
if(cell==='h')return '<rect width="32" height="32" fill="#71904c"/><rect x="2" y="6" width="28" height="23" rx="2" fill="#d6b77e"/><path d="M0 9L16 0 32 9V14H0Z" fill="#86523c"/><rect x="13" y="17" width="7" height="12" fill="#664c36"/><rect x="4" y="17" width="5" height="6" fill="#b8e0d0"/>';
if(cell==='m')return '<rect width="32" height="32" fill="#666f65"/><path d="M0 24L11 5l11 19zM15 26L26 6l9 20z" fill="#87918a"/><path d="M11 5l-3 5h6zM26 6l-3 6h6z" fill="#cbd0bc"/>';
if(rowsGrass(g.zone,x,y))return '<rect width="32" height="32" fill="#60954c"/><path d="M3 28l4-19 6 17 3-22 5 21 6-18 2 21" stroke="#244f2c" stroke-width="4" fill="none"/><path d="M6 24l4-14m9 14l2-12" stroke="#94c567" stroke-width="2"/>';
if(cell==='r')return '<rect width="32" height="32" fill="#8a9d60"/><rect width="32" height="32" fill="#c1aa76" opacity=".92"/>'+soil;
return '<rect width="32" height="32" fill="'+(g.zone===2?'#4b784b':'#76a45c')+'"/>'+grass+(seed===2?'<circle cx="26" cy="9" r="2" fill="#f5d97e"/>':'');
}
function worldPanel(){const p=worldPosition(),pois=WORLD_POIS[g.zone]||[],rows=WORLD_ROWS[g.zone];return `<section class="world"><div class="world-head"><strong>🗺️ ${esc(ZONES[g.zone][0])}</strong><span class="tag">Exploración 2D</span></div><div class="world-frame"><svg class="world-art" viewBox="0 0 480 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa interactivo de ${esc(ZONES[g.zone][0])}">${rows.map((row,y)=>[...row].map((cell,x)=>`<g transform="translate(${x*32},${y*32})">${terrainSVG(cell,x,y)}</g>`).join('')).join('')}${pois.map((q,i)=>`<g transform="translate(${q.x*32},${q.y*32})"><rect x="3" y="3" width="26" height="26" rx="6" fill="#192b22" opacity=".72"/><text x="16" y="23" text-anchor="middle" font-size="20">${q.emoji}</text></g>`).join('')}<g transform="translate(${p.x*32},${p.y*32})"><ellipse cx="16" cy="28" rx="11" ry="4" fill="#172f23" opacity=".65"/><circle cx="16" cy="10" r="7" fill="#f0c18d"/><path d="M6 7Q16 -3 26 7" fill="#573c29"/><path d="M10 17h12l5 11H5Z" fill="#b43d3a"/><path d="M10 19h12" stroke="#f5d587" stroke-width="3"/></g></svg><div class="world-clickgrid">${rows.map((row,y)=>[...row].map((cell,x)=>{const idx=pois.findIndex(q=>q.x===x&&q.y===y),near=idx>=0&&Math.abs(p.x-x)+Math.abs(p.y-y)<=1;return `<button class="world-hit" aria-label="${esc(idx>=0?pois[idx].label:'Casilla '+x+','+y)}" onclick="${near?`worldInteract(${idx})`:`worldStepTo(${x},${y})`}" type="button"></button>`}).join('')).join('')}</div></div><div class="world-help">Muévete con las flechas o toca una casilla vecina. Acércate a los iconos para interactuar.</div><div class="pad"><span></span><button onclick="worldMove(0,-1)">↑</button><span></span><button onclick="worldMove(-1,0)">←</button><button onclick="worldMove(0,1)">↓</button><button onclick="worldMove(1,0)">→</button></div><div class="world-action">${pois.map((q,i)=>{const near=Math.abs(p.x-q.x)+Math.abs(p.y-q.y)<=1;return `<button class="secondary" ${near?'':'disabled'} onclick="worldInteract(${i})">${q.emoji} ${esc(q.label)}</button>`}).join(' ')}</div></section>`}
function rowsGrass(zone,x,y){return !!POOLS[zone]&&WORLD_ROWS[zone]?.[y]?.[x]==='g'&&((x*17+y*11+zone*5)%5<3)}
function worldStepTo(x,y){const p=worldPosition();if(Math.abs(p.x-x)+Math.abs(p.y-y)!==1)return;worldMove(x-p.x,y-p.y)}
const STARTER_POOL=['Bulbasaur','Charmander','Squirtle','Pidgey','Oddish','Shinx','Wooper','Geodude','Psyduck'];
function starterChoices(){let a=[...STARTER_POOL],seed=windowStarterSeed>>>0;for(let i=a.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3)}
const windowStarterSeed=(Date.now()>>>0)||1;
function questAvailable(id){if(!g)return false;g.runQuests??=QUESTS.map(q=>q.id).filter((_,i)=>((g.seed>>>i)&1)===1);if(g.runQuests.length<2)g.runQuests=['mensajero','hierbas'];return g.runQuests.includes(id)}
function campaignFlavor(){const arc=story();const progress=storyState();if(g.gym)return `🏅 Has superado Rathôl Mortak. ${g.ethics>=2?'Los viajeros recuerdan tus gestos de ayuda.':g.ethics<=-2?'Algunos habitantes aún desconfían de tus decisiones.':'Tu historia apenas comienza.'} ${progress==='done'?'También has resuelto el misterio de '+arc.title+'.':'Quedan misterios sin resolver.'}`;return `🌄 Rumores de la región: ${arc.title}. ${g.ethics>=2?'Tu generosidad empieza a abrir puertas.':g.ethics<=-2?'Tus decisiones despiertan recelos.':'Cada decisión puede cambiar tu camino.'}`}
function start(name){if(!starterChoices().includes(name))return;g={seed:windowStarterSeed,serial:0,zone:0,unlocked:0,steps:0,team:[],box:[],pi:0,money:500,bag:{ball:5,potion:2},ethics:0,rep:0,decisions:{},quests:{},flags:{},encountered:{},caught:[],trainers:{},trainerEncounters:{},npcChoices:{},storyProgress:"offered",gym:false,over:false,log:[]};g.team.push(make(name,5));note(`Eliges a ${name}. La aventura comienza en la Comarca.`);save();render()}
function exportSave(){if(!g)return;const el=document.getElementById('save-transfer');if(el){el.value=JSON.stringify({format:'pokemon-tierra-media',version:'16.1',state:g});el.focus();el.select()}}
function importSave(){const el=document.getElementById('save-transfer');if(!el)return;let v;try{v=JSON.parse(el.value)}catch(e){alert('El texto no es un guardado JSON válido.');return}if(v?.format!=='pokemon-tierra-media'||v.version!=='16.1'||!v.state||!Array.isArray(v.state.team)||!Array.isArray(v.state.log)||!Number.isInteger(v.state.zone)||v.state.zone<0||v.state.zone>=ZONES.length||!Number.isFinite(v.state.seed)||v.state.team.length>6||v.state.team.some(p=>!SPEC[p.name]||!Number.isFinite(p.hp)||!Number.isFinite(p.max)||p.max<=0||p.hp<0||p.hp>p.max)){alert('Guardado incompatible o dañado.');return}if(!confirm('¿Reemplazar la partida actual por la importada?'))return;g=v.state;save();render()}
function saveTransferPanel(){return `<details class="save-tools"><summary>💾 Copiar o recuperar partida</summary><p class="sub">Para trasladar la partida entre direcciones web: exporta, copia el texto y pégalo en la nueva versión.</p><textarea id="save-transfer" rows="3" aria-label="Texto de partida" placeholder="Aquí aparecerá tu partida o puedes pegar una anterior"></textarea><div class="btns"><button class="secondary" onclick="exportSave()">Exportar texto</button><button class="secondary" onclick="importSave()">Importar partida</button></div></details>`}
function card(p){return `<div class="poke"><div class="row"><strong>${esc(p.name)}</strong><span class="tag">Nv. ${p.lvl}</span></div><span class="sub">${p.dead?'☠️ Fallecido':p.hp+' / '+p.max+' PS'}</span><div class="bar"><div class="fill ${p.hp/p.max<.3?'low':''}" style="width:${p.hp/p.max*100}%"></div></div><span class="sub">${SPEC[p.name].type.join(' / ')} · EXP ${p.xp}/${xpNeed(p.lvl)}</span></div>`}

const REGION_ART={0:'comarca.webp',1:'comarca.webp',2:'bosque_combate.webp',3:'bosque_combate.webp',4:'bree.webp',5:'bree.webp',6:'tierra_media.webp',7:'tierra_media.webp'};
function regionPlate(z){const caption=['Los agujeros hobbit y los huertos de la Comarca','Praderas de la Cuaderna del Este','Arboledas del camino','Arroyo de las tierras occidentales','Camino del Este','Calles y posadas de Bree','Estribaciones de las Montañas Nubladas','Puertas de Rathôl Mortak'][z];return `<div class="region-plate"><img loading="lazy" src="${ASSET_URL[REGION_ART[z]]}" alt="Ilustración de ${esc(ZONES[z][0])}"><span>${esc(caption)}</span></div>`}

// Each house has a separate, saved floor plan. NPC dialogue requires physical proximity.
const ROOM_MAPS={
 milo:["#########","#..s....#","#..t.n..#","#.......#","#.......#","####d####"],
 adela:["#########","#..s....#","#....n..#","#..t....#","#.......#","####d####"],
 posada:["#########","#..s..s.#","#....n..#","#..t....#","#.......#","####d####"]
};
function roomPosition(){g.roomPositions??={};const id=g.inside;g.roomPositions[id]??={x:4,y:4};const p=g.roomPositions[id];if(!roomWalkable(p.x,p.y))g.roomPositions[id]={x:4,y:4};return g.roomPositions[id]}
function roomWalkable(x,y){const c=ROOM_MAPS[g.inside]?.[y]?.[x];return !!c&&c!== '#'&&c!=='n'&&c!=='t'&&c!=='s'}
function roomNearNPC(){if(sceneMode()&&g.inside)return true;if(!g.inside)return false;const p=roomPosition();return Math.abs(p.x-5)+Math.abs(p.y-2)<=1}
function roomMove(dx,dy){if(!g||!g.inside||g.battle||g.over)return;const p=roomPosition(),x=p.x+dx,y=p.y+dy;if(!roomWalkable(x,y))return;p.x=x;p.y=y;g.npcDialog=null;save();render()}
function roomStepTo(x,y){const p=roomPosition();if(Math.abs(x-p.x)+Math.abs(y-p.y)===1)roomMove(x-p.x,y-p.y)}
function roomPanel(){const rows=ROOM_MAPS[g.inside],p=roomPosition(),near=roomNearNPC();const tile={"#":"🪵",".":"🟫",s:"📚",t:"🪑",n:"🧑",d:"🚪"};return `<section class="room-explore"><div class="room-heading">🏠 Explora el interior · Acércate a su habitante</div><div class="room-grid">${rows.map((row,y)=>[...row].map((c,x)=>`<button class="room-tile ${c==='#'?'room-wall':''}" type="button" aria-label="${x===p.x&&y===p.y?'Tu personaje':c==='n'?'Habitante':c==='d'?'Puerta':'Casilla'}" onclick="${c==='n'&&Math.abs(p.x-x)+Math.abs(p.y-y)<=1?`talk('${{milo:'hortelano',adela:'anciana',posada:'posadera'}[g.inside]}')`:c==='d'&&Math.abs(p.x-x)+Math.abs(p.y-y)<=1?'exitHouse()':`roomStepTo(${x},${y})`}">${x===p.x&&y===p.y?'🧍':tile[c]}</button>`).join('')).join('')}</div><div class="pad"><span></span><button onclick="roomMove(0,-1)">↑</button><span></span><button onclick="roomMove(-1,0)">←</button><button onclick="roomMove(0,1)">↓</button><button onclick="roomMove(1,0)">→</button></div><div class="room-controls"><button class="gold" ${near?'':'disabled'} onclick="talk('${{milo:'hortelano',adela:'anciana',posada:'posadera'}[g.inside]}')">💬 Hablar con el habitante</button><button class="secondary" onclick="exitHouse()">🚪 Salir</button></div></section>`}
function interiorArt(){const id=g.inside;const room={milo:['milo.webp','Casa de Milo','Milo, jardinero hobbit','hortelano'],adela:['casa_bilbo.webp','Casa de Adela','Adela, vecina de la Comarca','anciana'],posada:['posadero.webp','Posada de Bree','Bera, posadera de Bree','posadera']}[id];if(!room)return '';return `<div class="room-art"><img src="${ASSET_URL[room[0]]}" alt="Interior ilustrado: ${esc(room[1])}"><div class="room-caption"><strong>${esc(room[1])}</strong><span>${esc(room[2])}</span><span class="tag">Acércate para conversar</span></div></div>`}
function npcPortrait(){if(!g.npcDialog)return '';const n=NPCS.find(n=>n.id===g.npcDialog&&npcAccessible(n.id));if(!n)return '';const pic={hortelano:'milo.webp',anciana:'casa_bilbo.webp',posadera:'posadero.webp'}[n.id];return pic?`<img class="dialog-portrait" src="${ASSET_URL[pic]}" alt="Retrato ilustrado de ${esc(n.name)}">`:''}
function battleArt(p,e){const pic={Charmander:'charmander.webp',Pidgey:'pidgey.webp'};return `<div class="battle-art" role="img" aria-label="Combate entre ${esc(p.name)} y ${esc(e.name)}">${pic[p.name]?`<img class="battle-mon ours" src="${ASSET_URL[pic[p.name]]}" alt="${esc(p.name)}">`:`<div class="battle-mon ours" style="display:grid;place-items:center;background:#465f4b;font-size:35px">⚔️</div>`}${pic[e.name]?`<img class="battle-mon foe" src="${ASSET_URL[pic[e.name]]}" alt="${esc(e.name)}">`:`<div class="battle-mon foe" style="display:grid;place-items:center;background:#465f4b;font-size:35px">🌿</div>`}<div class="battle-tag ours">${esc(p.name)} · Nv. ${p.lvl} · ${p.hp}/${p.max} PS</div><div class="battle-tag foe">${esc(e.name)} · Nv. ${e.lvl} · ${e.hp}/${e.max} PS</div></div>`}
function render(){if(!g){$('app').innerHTML=`<div class="intro panel"><div class="hero">🌄</div><h2>Una mañana en la Comarca</h2><p>La brisa recorre los campos mientras un viajero te ofrece elegir a tu primer compañero. Más allá de los caminos conocidos, los enanos hablan de un desafío de tipo Roca.</p><div class="note">En esta aventura, un Pokémon que llega a 0 PS muere para siempre. Las capturas por zona son limitadas.</div><h3>Elige a tu compañero</h3><div class="grid">${starterChoices().map(n=>`<button onclick="start('${n}')">${n}<br><small>Nivel 5</small></button>`).join('')}</div></div>`;return}const z=g.zone;let main=`<div class="panel"><div class="row"><h2>${ZONES[z][1]} ${ZONES[z][0]}</h2><span class="tag">${g.gym?'🏅 Insignia de Roca':'Capítulo I'}</span></div><p>${ZONES[z][2]}</p><div class="map">${ZONES.map((p,i)=>`<button class="place ${i===z?'active':''} ${i>g.unlocked?'locked':''}" ${i>g.unlocked||g.battle||g.over?'disabled':''} onclick="travel(${i})">${p[1]}<br>${p[0]}</button>`).join('')}</div>${!g.battle&&!g.over&&!g.inside?sceneScene():''}${!g.battle&&!g.over&&g.inside?sceneInterior():''}${!g.battle&&!g.over?narrativePanel():''}`;
if(g.over)main+=`<div class="note"><h2>Fin de la aventura</h2>Todos tus Pokémon han muerto. Su recuerdo permanece en el memorial.</div><button class="danger" onclick="resetGame()">Nueva partida</button>`;
else if(g.battle){const b=g.battle,p=active('p'),e=active('e');main+=`<h3>⚔️ ${b.kind==='gym'?'Rathôl Mortak':b.kind==='trainer'?'Entrenador':'Encuentro salvaje'}</h3>${battleArt(p,e)}<div class="grid">${card(p)}${card(e)}</div><p class="muted">Turno ${b.turn+1} · ${b.kind==='wild'?(b.catchable?'Captura disponible':'Solo entrenamiento'):''}</p><div class="btns">${p.moves.map(m=>`<button ${p.pp[m]===0?'disabled':''} onclick="battleAction('move','${m}')">${m} <small>(${p.pp[m]} PP)</small></button>`).join('')}</div><div class="btns"><button class="secondary" ${!g.bag.potion||p.hp===p.max?'disabled':''} onclick="battleAction('potion')">🧪 Poción (${g.bag.potion})</button>${b.kind==='wild'?`<button class="secondary" onclick="battleAction('flee')">🏃 Huir${z===1?' (seguro)':''}</button><button class="gold" ${!b.catchable||!g.bag.ball?'disabled':''} onclick="battleAction('ball')">🔴 Poké Ball (${g.bag.ball})</button>`:''}</div><h3>Cambiar de compañero</h3><div class="btns">${g.team.map((x,i)=>`<button class="secondary" ${i===g.pi||x.dead||x.hp<=0?'disabled':''} onclick="battleAction('switch',${i})">${x.name} ${x.hp} PS</button>`).join('')}</div>`}
else{main+=`${z===1?`<div class="note">🌱 Zona de iniciación: salvajes adaptados, daño reducido y huida garantizada. Puedes volver a la Comarca para curarte. La muerte permanente sigue activa.</div>`:''}<div class="btns">${POOLS[z]?`<button onclick="explore()">🌿 Explorar la zona</button>`:''}${z===0||z===5?`<button onclick="heal()">💚 Descansar en lugar seguro</button>`:''}${(z===4||z===6)&&!g.trainerEncounters?.['ruta_'+z]?`<button onclick="trainer()">⚔️ Desafiar a un entrenador</button>`:''}${z===7&&!g.gym?`<button class="gold" onclick="gym()">⚒️ Desafiar a Rathôl</button>`:''}${z===5?`<button onclick="buy('ball')">Poké Ball · 200</button><button onclick="buy('potion')">Poción · 300</button>`:''}${z===2&&!g.decisions?.bosquecillo?`<div class="note">Encuentras a un Pokémon herido junto a unas provisiones abandonadas. ¿Qué decides hacer?</div><button class="secondary" onclick="ethics('bosquecillo','ayudar')">Ayudar al Pokémon herido</button><button class="secondary" onclick="ethics('bosquecillo','provisiones')">Tomar las provisiones ajenas</button>`:''}${g.unlocked<7&&z===g.unlocked?`<button class="gold" onclick="advance()">➡️ Abrir siguiente tramo</button>`:''}</div>${z===6?`<div class="note">Los enanos advierten: los Pokémon de Agua y Planta son especialmente útiles frente a los de Roca. Entrena antes de entrar.</div>`:''}${g.gym?`<div class="note">🏅 Has superado el primer gimnasio. Fin del capítulo disponible en este prototipo.</div>`:''}`}
main+='</div>';const side=`<div class="panel"><h3>🎒 Aventura</h3>${saveTransferPanel()}<div class="row"><span>Pokécuartos</span><strong>${g.money}</strong></div><div class="row"><span>Poké Balls</span><strong>${g.bag.ball}</strong></div><div class="row"><span>Pociones</span><strong>${g.bag.potion}</strong></div><div class="row"><span>Ética</span><strong>${g.ethics}</strong></div><div class="row"><span>Capturas</span><strong>${g.caught.length}</strong></div><hr style="border-color:#34504d"><h3>Equipo (${g.team.length}/6)</h3><div class="grid">${g.team.map(card).join('')}</div><p class="sub">Cajas: ${g.box.length} · Memorial: ${[...g.team,...g.box].filter(p=>p.dead).length} fallecidos</p></div><div class="panel"><h3>📜 Diario completo</h3><div class="log">${g.log.map(s=>`<div>${esc(s)}</div>`).join('')}</div></div><div class="panel"><button class="secondary" onclick="save();alert('Partida guardada en este navegador.')">💾 Guardar</button> <button class="danger" onclick="resetGame()">Reiniciar</button><p class="sub">Autoguardado tras cada decisión. Sin servidor.</p></div>`;$('app').innerHTML=`<div class="layout"><main>${main}</main><aside>${side}</aside></div>`}
function resetGame(){if(confirm('¿Eliminar esta partida y empezar de nuevo?')){localStorage.removeItem('pokemon_middleearth_v161');g=null;render()}}try{const saved=localStorage.getItem('pokemon_middleearth_v161');if(saved){g=JSON.parse(saved);if(!g||!Array.isArray(g.team))g=null}}catch(e){g=null}render();
</script></body></html>
